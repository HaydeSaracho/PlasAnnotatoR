[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasannotator"
version = "0.1.0"
description = "Plasmid prediction, annotation and network analysis tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "typer[all]>=0.12",
    "biopython>=1.83",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.3",
    "flask>=3.0",
    "rich>=13.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.scripts]
plasannotator = "plasannotator.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["plasannotator*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]